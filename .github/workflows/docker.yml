name: build-and-push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dieses4lipp/pokemon-tcg-discord-bot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/DiscordBot.Tests/DiscordBot.Tests.csproj

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: pokebot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          RUN="docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges"
          out=$($RUN pokebot:ci 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "Token couldn't be read"
          $RUN --entrypoint sh pokebot:ci -c '
            test -f /app/DiscordBot.dll &&
            test -f /app/Data/expeditionSettings.json &&
            test -f /app/Assets/sets_covers/default.jpg &&
            test "$(id -u)" != 0'
          # With a fake token the bot migrates the database, then retries the login until killed:
          # proves the native SQLite library loads and /app/data is the only write path needed
          mkdir -m 777 smoke-data
          out=$(timeout 30 $RUN -e TOKEN=smoke-test -v "$PWD/smoke-data:/app/data" pokebot:ci 2>&1) || true
          echo "$out"
          echo "$out" | grep -q "Database /app/data/bot.db ready"
          test -f smoke-data/bot.db
          echo "smoke test passed"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
